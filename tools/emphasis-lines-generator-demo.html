<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emphasis Lines Generator Demo</title>
<style>
:root{color-scheme:dark;--bg:#111827;--panel:#18202b;--panel2:#222c3a;--line:#3b4758;--text:#eef2f7;--muted:#9ca3af;--accent:#2487d8}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Segoe UI,Meiryo,sans-serif;background:var(--bg);color:var(--text)}body{display:grid;grid-template-columns:minmax(0,1fr) 340px;overflow:hidden}main{display:flex;flex-direction:column;gap:10px;padding:12px;min-width:0}.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}button,.button{border:1px solid var(--line);background:#273244;color:#fff;border-radius:7px;padding:7px 10px;cursor:pointer;font:inherit}button:hover,.button:hover{border-color:#63b0f2}button.active,button.primary{background:var(--accent);border-color:#66b8ff}#wrap{flex:1;min-height:420px;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:repeating-conic-gradient(#242c38 0 25%,#171d25 0 50%) 0/24px 24px}canvas{max-width:100%;max-height:100%;cursor:crosshair;touch-action:none}aside{overflow:auto;padding:10px;background:var(--panel);border-left:1px solid var(--line)}section{border:1px solid var(--line);border-radius:8px;margin-bottom:9px;overflow:hidden}h2{font-size:13px;margin:0;padding:8px 9px;background:var(--panel2)}.c{padding:9px;display:grid;gap:7px}.r{display:grid;grid-template-columns:120px 1fr 54px;gap:6px;align-items:center}.r2{display:grid;grid-template-columns:120px 1fr;gap:6px;align-items:center}input,select{width:100%}input[type=number],select{background:#0e1520;color:#fff;border:1px solid var(--line);border-radius:5px;padding:5px}input[type=range]{accent-color:#4ea1ff}output{font-size:11px;color:var(--muted);text-align:right}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.small{font-size:11px;color:var(--muted);line-height:1.45}.hide{display:none}@media(max-width:820px){body{grid-template-columns:1fr;height:auto;overflow:auto}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<main>
<div class="bar"><b>Emphasis Lines Generator Demo</b><button id="regen" class="primary">再生成</button><button id="newSeed">Seed変更</button><button id="center">中心へ</button><label class="button">背景画像<input class="hide" id="file" type="file" accept="image/*"></label><button id="clear">背景を外す</button></div>
<div id="wrap"><canvas id="cv"></canvas></div>
</main>
<aside>
<section><h2>プリセット</h2><div class="c grid"><button data-p="center" class="active">中央集中線</button><button data-p="wide">横長集中線</button><button data-p="tall">縦長集中線</button><button data-p="side">片側集中線</button></div></section>
<section><h2>基本設定</h2><div class="c">
<div class="r"><span>線の本数</span><input id="count" type="range" min="20" max="500"><output></output></div>
<div class="r"><span>中央空白 横</span><input id="ix" type="range" min=".03" max=".48" step=".005"><output></output></div>
<div class="r"><span>中央空白 縦</span><input id="iy" type="range" min=".03" max=".48" step=".005"><output></output></div>
<div class="r"><span>基本線幅</span><input id="width" type="range" min=".0005" max=".035" step=".0005"><output></output></div>
<div class="r"><span>線の長さ</span><input id="length" type="range" min=".15" max="1" step=".01"><output></output></div>
<div class="r"><span>先端の細さ</span><input id="taper" type="range" min="0" max="1" step=".01"><output></output></div>
<div class="r"><span>中心 X</span><input id="cx" type="range" min="-.5" max="1.5" step=".005"><output></output></div>
<div class="r"><span>中心 Y</span><input id="cy" type="range" min="-.5" max="1.5" step=".005"><output></output></div>
</div></section>
<section><h2>ランダム</h2><div class="c">
<div class="r"><span>長さ</span><input id="lr" type="range" min="0" max="1" step=".01"><output></output></div>
<div class="r"><span>太さ</span><input id="wr" type="range" min="0" max="1" step=".01"><output></output></div>
<div class="r"><span>間隔</span><input id="sr" type="range" min="0" max="1" step=".01"><output></output></div>
<div class="r2"><span>Seed</span><input id="seed" type="number" min="0" max="4294967295"></div>
</div></section>
<section><h2>色・出力</h2><div class="c">
<div class="r2"><span>線色</span><input id="color" type="color" value="#000000"></div>
<div class="r"><span>不透明度</span><input id="opacity" type="range" min=".02" max="1" step=".01"><output></output></div>
<div class="r2"><span>解像度</span><select id="res"><option>1024x1024</option><option>1920x1080</option><option selected>2048x2048</option><option>2560x1440</option><option>3072x2048</option></select></div>
<div class="grid"><button id="save" class="primary">透過PNG保存</button><button id="copy">JSONコピー</button></div><div id="status" class="small"></div></div></section>
<div class="small">キャンバスをクリック／ドラッグして集中点を移動できます。表示は軽量プレビュー、PNGは指定解像度で再描画します。</div>
</aside>
<script>
const $=x=>document.getElementById(x),cv=$("cv"),ct=cv.getContext("2d"),bg=new Image();let hasBg=false,drag=false,preset="center";
const presets={center:{count:180,ix:.22,iy:.22,width:.006,length:.93,taper:.87,cx:.5,cy:.5,lr:.32,wr:.48,sr:.38},wide:{count:210,ix:.31,iy:.16,width:.005,length:.95,taper:.9,cx:.5,cy:.5,lr:.3,wr:.55,sr:.42},tall:{count:190,ix:.15,iy:.31,width:.0055,length:.96,taper:.88,cx:.5,cy:.5,lr:.35,wr:.5,sr:.42},side:{count:130,ix:.17,iy:.23,width:.008,length:.9,taper:.82,cx:-.12,cy:.5,lr:.38,wr:.5,sr:.34}};
const s={...presets.center,color:"#000000",opacity:1,seed:123456789},ids=["count","ix","iy","width","length","taper","cx","cy","lr","wr","sr","opacity"];
function fmt(id,v){if(id==="count")return Math.round(v);if(["ix","iy","cx","cy"].includes(id))return(v*100).toFixed(1)+"%";return Math.round(v*100)+"%"}
function sync(){ids.forEach(id=>{let e=$(id);e.value=s[id];e.nextElementSibling.value=fmt(id,s[id])});$("color").value=s.color;$("seed").value=s.seed>>>0}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function ellipseRadius(rx,ry,a){const c=Math.cos(a),d=Math.sin(a);return 1/Math.sqrt(c*c/rx/rx+d*d/ry/ry)}
function exitDistance(cx,cy,dx,dy,w,h){const q=[];if(dx>0)q.push((w-cx)/dx);if(dx<0)q.push(-cx/dx);if(dy>0)q.push((h-cy)/dy);if(dy<0)q.push(-cy/dy);return Math.min(...q.filter(v=>v>0))}
function rgba(){const n=parseInt(s.color.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${s.opacity})`}
function buildRays(w,h){const r=rng(s.seed),cx=s.cx*w,cy=s.cy*h,b=Math.min(w,h),rx=s.ix*w,ry=s.iy*h,out=[];for(let i=0;i<s.count;i++){const a=i/s.count*Math.PI*2+(r()-.5)*Math.PI*2/s.count*s.sr*1.9,dx=Math.cos(a),dy=Math.sin(a),inner=ellipseRadius(rx,ry,a),edge=exitDistance(cx,cy,dx,dy,w,h);if(!isFinite(edge))continue;const usable=Math.max(0,edge-inner),start=Math.max(0,inner+usable*s.lr*(r()-.5)*.18),end=inner+usable*s.length*(1-s.lr*r());if(end<=start+1)continue;const width=Math.max(.3,b*s.width*(1+(r()-.5)*2*s.wr)),startWidth=Math.max(.05,width*(1-s.taper)),px=-dy,py=dx,sx=cx+dx*start,sy=cy+dy*start,ex=cx+dx*end,ey=cy+dy*end;out.push([[sx+px*startWidth/2,sy+py*startWidth/2],[ex+px*width/2,ey+py*width/2],[ex-px*width/2,ey-py*width/2],[sx-px*startWidth/2,sy-py*startWidth/2]])}return out}
function drawLines(c,w,h){c.fillStyle=rgba();for(const p of buildRays(w,h)){c.beginPath();c.moveTo(...p[0]);p.slice(1).forEach(v=>c.lineTo(...v));c.closePath();c.fill()}}
function draw(){const r=$("wrap").getBoundingClientRect();let w=Math.max(400,r.width-20),h=Math.max(300,Math.min(r.height-20,w/1.35));w=Math.floor(Math.min(w,h*1.35));cv.width=w;cv.height=h;ct.clearRect(0,0,w,h);if(hasBg){const k=Math.min(w/bg.naturalWidth,h/bg.naturalHeight),dw=bg.naturalWidth*k,dh=bg.naturalHeight*k;ct.drawImage(bg,(w-dw)/2,(h-dh)/2,dw,dh)}drawLines(ct,w,h);const x=s.cx*w,y=s.cy*h;ct.strokeStyle="#ffd32a";ct.lineWidth=2;ct.beginPath();ct.arc(x,y,7,0,Math.PI*2);ct.moveTo(x-12,y);ct.lineTo(x+12,y);ct.moveTo(x,y-12);ct.lineTo(x,y+12);ct.stroke()}
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
cv.onpointerdown=e=>{drag=true;cv.setPointerCapture(e.pointerId);[s.cx,s.cy]=pos(e);sync();draw()};cv.onpointermove=e=>{if(drag){[s.cx,s.cy]=pos(e);sync();draw()}};cv.onpointerup=()=>drag=false;
ids.forEach(id=>$(id).oninput=e=>{s[id]=id==="count"?+e.target.value:parseFloat(e.target.value);e.target.nextElementSibling.value=fmt(id,s[id]);draw()});document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{preset=b.dataset.p;Object.assign(s,presets[preset]);document.querySelectorAll("[data-p]").forEach(x=>x.classList.toggle("active",x===b));sync();draw()});$("color").oninput=e=>{s.color=e.target.value;draw()};$("seed").oninput=e=>{s.seed=(+e.target.value||0)>>>0;draw()};$("regen").onclick=draw;$("newSeed").onclick=()=>{s.seed=crypto.getRandomValues(new Uint32Array(1))[0];sync();draw()};$("center").onclick=()=>{s.cx=s.cy=.5;sync();draw()};$("file").onchange=e=>{const f=e.target.files[0];if(!f)return,u=URL.createObjectURL(f);bg.onload=()=>{hasBg=true;draw();URL.revokeObjectURL(u)};bg.src=u};$("clear").onclick=()=>{hasBg=false;draw()};$("save").onclick=()=>{const[w,h]=$("res").value.split("x").map(Number),out=document.createElement("canvas");out.width=w;out.height=h;drawLines(out.getContext("2d"),w,h);out.toBlob(blob=>{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`emphasis-${preset}-${s.seed}-${w}x${h}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$("status").textContent=`保存: ${w}×${h}`} ,"image/png")};$("copy").onclick=async()=>{const t=JSON.stringify({version:1,type:"emphasis_lines",preset,...s},null,2);try{await navigator.clipboard.writeText(t)}catch{}$("status").textContent="設定JSONをコピーしました"};new ResizeObserver(draw).observe($("wrap"));sync();draw();
</script>
</body>
</html>
