<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Emphasis Lines Generator Demo</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #111827;
      --panel: #18202b;
      --panel2: #222c3a;
      --line: #3b4758;
      --text: #eef2f7;
      --muted: #9ca3af;
      --accent: #2487d8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: "Segoe UI", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      overflow: hidden;
    }

    main {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      min-width: 0;
    }

    .bar {
      display: flex;
      gap: 7px;
      align-items: center;
      flex-wrap: wrap;
    }

    button,
    .button {
      border: 1px solid var(--line);
      background: #273244;
      color: #fff;
      border-radius: 7px;
      padding: 7px 10px;
      cursor: pointer;
      font: inherit;
    }

    button:hover,
    .button:hover {
      border-color: #63b0f2;
    }

    button.active,
    button.primary {
      background: var(--accent);
      border-color: #66b8ff;
    }

    #wrap {
      flex: 1;
      min-height: 420px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background-color: #fff;
      background-image:
        linear-gradient(45deg, #e5e5e5 25%, transparent 25%),
        linear-gradient(-45deg, #e5e5e5 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e5e5e5 75%),
        linear-gradient(-45deg, transparent 75%, #e5e5e5 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    aside {
      overflow: auto;
      padding: 10px;
      background: var(--panel);
      border-left: 1px solid var(--line);
    }

    section {
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-bottom: 9px;
      overflow: hidden;
    }

    h2 {
      font-size: 13px;
      margin: 0;
      padding: 8px 9px;
      background: var(--panel2);
    }

    .controls {
      padding: 9px;
      display: grid;
      gap: 7px;
    }

    .row {
      display: grid;
      grid-template-columns: 120px 1fr 54px;
      gap: 6px;
      align-items: center;
    }

    .row2 {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 6px;
      align-items: center;
    }

    input,
    select {
      width: 100%;
    }

    input[type="number"],
    select {
      background: #0e1520;
      color: #fff;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 5px;
    }

    input[type="range"] {
      accent-color: #4ea1ff;
    }

    input[type="color"] {
      height: 32px;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #0e1520;
    }

    output {
      font-size: 11px;
      color: var(--muted);
      text-align: right;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .small {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.45;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 820px) {
      body {
        grid-template-columns: 1fr;
        height: auto;
        overflow: auto;
      }

      aside {
        border-left: 0;
        border-top: 1px solid var(--line);
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="bar">
      <strong>Emphasis Lines Generator Demo</strong>
      <button id="regenerate" class="primary">再生成</button>
      <button id="randomSeed">Seed変更</button>
      <button id="resetCenter">中心へ</button>

      <label class="button">
        背景画像
        <input
          id="backgroundFile"
          class="hidden"
          type="file"
          accept="image/png,image/jpeg,image/webp"
        >
      </label>

      <button id="clearBackground">背景を外す</button>
    </div>

    <div id="wrap">
      <canvas id="canvas"></canvas>
    </div>
  </main>

  <aside>
    <section>
      <h2>プリセット</h2>
      <div class="controls grid">
        <button data-preset="center" class="active">中央集中線</button>
        <button data-preset="wide">横長集中線</button>
        <button data-preset="tall">縦長集中線</button>
        <button data-preset="side">片側集中線</button>
      </div>
    </section>

    <section>
      <h2>基本設定</h2>
      <div class="controls">
        <div class="row">
          <span>線の本数</span>
          <input id="count" type="range" min="20" max="500" step="1">
          <output></output>
        </div>

        <div class="row">
          <span>中央空白 横</span>
          <input id="innerX" type="range" min="0.03" max="0.48" step="0.005">
          <output></output>
        </div>

        <div class="row">
          <span>中央空白 縦</span>
          <input id="innerY" type="range" min="0.03" max="0.48" step="0.005">
          <output></output>
        </div>

        <div class="row">
          <span>基本線幅</span>
          <input id="lineWidth" type="range" min="0.0005" max="0.035" step="0.0005">
          <output></output>
        </div>

        <div class="row">
          <span>線の長さ</span>
          <input id="lineLength" type="range" min="0.15" max="1" step="0.01">
          <output></output>
        </div>

        <div class="row">
          <span>先端の細さ</span>
          <input id="taper" type="range" min="0" max="1" step="0.01">
          <output></output>
        </div>

        <div class="row">
          <span>端のはみ出し</span>
          <input id="overshoot" type="range" min="0" max="0.15" step="0.005">
          <output></output>
        </div>

        <div class="row">
          <span>中心 X</span>
          <input id="centerX" type="range" min="-0.5" max="1.5" step="0.005">
          <output></output>
        </div>

        <div class="row">
          <span>中心 Y</span>
          <input id="centerY" type="range" min="-0.5" max="1.5" step="0.005">
          <output></output>
        </div>
      </div>
    </section>

    <section>
      <h2>ランダム</h2>
      <div class="controls">
        <div class="row">
          <span>長さ</span>
          <input id="lengthRandom" type="range" min="0" max="1" step="0.01">
          <output></output>
        </div>

        <div class="row">
          <span>太さ</span>
          <input id="widthRandom" type="range" min="0" max="1" step="0.01">
          <output></output>
        </div>

        <div class="row">
          <span>間隔</span>
          <input id="spacingRandom" type="range" min="0" max="1" step="0.01">
          <output></output>
        </div>

        <div class="row2">
          <span>Seed</span>
          <input id="seed" type="number" min="0" max="4294967295" step="1">
        </div>
      </div>
    </section>

    <section>
      <h2>色・出力</h2>
      <div class="controls">
        <div class="row2">
          <span>線色</span>
          <input id="color" type="color" value="#000000">
        </div>

        <div class="row">
          <span>不透明度</span>
          <input id="opacity" type="range" min="0.02" max="1" step="0.01">
          <output></output>
        </div>

        <div class="row2">
          <span>解像度</span>
          <select id="resolution">
            <option value="1024x1024">1024 × 1024</option>
            <option value="1600x900">1600 × 900</option>
            <option value="1920x1080">1920 × 1080</option>
            <option value="2048x2048" selected>2048 × 2048</option>
            <option value="2560x1440">2560 × 1440</option>
            <option value="3072x2048">3072 × 2048</option>
          </select>
        </div>

        <div class="grid">
          <button id="savePng" class="primary">透過PNG保存</button>
          <button id="copyJson">JSONコピー</button>
        </div>

        <div id="status" class="small"></div>
      </div>
    </section>

    <div class="small">
      初期値は「線の長さ100%・長さランダム0%・先端の細さ100%」です。
      線はキャンバス端より少し外まで描画されます。
      キャンバスをクリックまたはドラッグすると集中点を移動できます。
    </div>
  </aside>

  <script>
    "use strict";

    const getElement = (id) => document.getElementById(id);
    const canvas = getElement("canvas");
    const context = canvas.getContext("2d");
    const backgroundImage = new Image();

    let hasBackground = false;
    let dragging = false;
    let currentPreset = "center";

    const commonDefaults = {
      lineLength: 1,
      taper: 1,
      overshoot: 0.035,
      lengthRandom: 0
    };

    const presets = {
      center: {
        ...commonDefaults,
        count: 180,
        innerX: 0.15,
        innerY: 0.20,
        lineWidth: 0.006,
        centerX: 0.5,
        centerY: 0.5,
        widthRandom: 0.48,
        spacingRandom: 0.38
      },

      wide: {
        ...commonDefaults,
        count: 210,
        innerX: 0.27,
        innerY: 0.16,
        lineWidth: 0.005,
        centerX: 0.5,
        centerY: 0.5,
        widthRandom: 0.55,
        spacingRandom: 0.42
      },

      tall: {
        ...commonDefaults,
        count: 190,
        innerX: 0.13,
        innerY: 0.29,
        lineWidth: 0.0055,
        centerX: 0.5,
        centerY: 0.5,
        widthRandom: 0.50,
        spacingRandom: 0.42
      },

      side: {
        ...commonDefaults,
        count: 130,
        innerX: 0.15,
        innerY: 0.20,
        lineWidth: 0.008,
        centerX: -0.12,
        centerY: 0.5,
        widthRandom: 0.50,
        spacingRandom: 0.34
      }
    };

    const state = {
      ...presets.center,
      color: "#000000",
      opacity: 1,
      seed: 1529756813
    };

    const controlIds = [
      "count",
      "innerX",
      "innerY",
      "lineWidth",
      "lineLength",
      "taper",
      "overshoot",
      "centerX",
      "centerY",
      "lengthRandom",
      "widthRandom",
      "spacingRandom",
      "opacity"
    ];

    function formatValue(id, value) {
      if (id === "count") {
        return String(Math.round(value));
      }

      if (
        id === "innerX" ||
        id === "innerY" ||
        id === "centerX" ||
        id === "centerY"
      ) {
        return `${(value * 100).toFixed(1)}%`;
      }

      if (id === "lineWidth") {
        return `${(value * 100).toFixed(2)}%`;
      }

      return `${Math.round(value * 100)}%`;
    }

    function syncControls() {
      for (const id of controlIds) {
        const input = getElement(id);
        input.value = state[id];
        input.nextElementSibling.value = formatValue(id, state[id]);
      }

      getElement("color").value = state.color;
      getElement("seed").value = state.seed >>> 0;
    }

    function createRandom(seed) {
      let value = seed >>> 0;

      return function random() {
        value |= 0;
        value = value + 0x6D2B79F5 | 0;

        let result = Math.imul(value ^ value >>> 15, 1 | value);
        result = result + Math.imul(result ^ result >>> 7, 61 | result) ^ result;

        return ((result ^ result >>> 14) >>> 0) / 4294967296;
      };
    }

    function ellipseRadius(radiusX, radiusY, angle) {
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);

      return 1 / Math.sqrt(
        cos * cos / (radiusX * radiusX) +
        sin * sin / (radiusY * radiusY)
      );
    }

    function rectangleExitDistance(
      centerX,
      centerY,
      directionX,
      directionY,
      width,
      height
    ) {
      const distances = [];

      if (directionX > 0) {
        distances.push((width - centerX) / directionX);
      } else if (directionX < 0) {
        distances.push((0 - centerX) / directionX);
      }

      if (directionY > 0) {
        distances.push((height - centerY) / directionY);
      } else if (directionY < 0) {
        distances.push((0 - centerY) / directionY);
      }

      const positiveDistances = distances.filter((distance) => distance > 0);

      if (positiveDistances.length === 0) {
        return Infinity;
      }

      return Math.min(...positiveDistances);
    }

    function colorToRgba(hex, opacity) {
      const numericColor = parseInt(hex.slice(1), 16);
      const red = numericColor >> 16;
      const green = numericColor >> 8 & 255;
      const blue = numericColor & 255;

      return `rgba(${red}, ${green}, ${blue}, ${opacity})`;
    }

    function buildRays(width, height) {
      const random = createRandom(state.seed);
      const centerX = state.centerX * width;
      const centerY = state.centerY * height;
      const baseSize = Math.min(width, height);
      const innerRadiusX = Math.max(2, state.innerX * width);
      const innerRadiusY = Math.max(2, state.innerY * height);
      const count = Math.round(state.count);
      const rays = [];

      for (let index = 0; index < count; index += 1) {
        const regularAngle = index / count * Math.PI * 2;
        const angleJitter =
          (random() - 0.5) *
          (Math.PI * 2 / count) *
          state.spacingRandom *
          1.9;

        const angle = regularAngle + angleJitter;
        const directionX = Math.cos(angle);
        const directionY = Math.sin(angle);

        const innerDistance = ellipseRadius(
          innerRadiusX,
          innerRadiusY,
          angle
        );

        const edgeDistance = rectangleExitDistance(
          centerX,
          centerY,
          directionX,
          directionY,
          width,
          height
        );

        if (!Number.isFinite(edgeDistance)) {
          continue;
        }

        const overshootDistance = baseSize * state.overshoot;
        const outerDistance = edgeDistance + overshootDistance;
        const usableDistance = Math.max(0, outerDistance - innerDistance);
        const lengthVariation = 1 - state.lengthRandom * random();

        const startVariation =
          usableDistance *
          state.lengthRandom *
          (random() - 0.5) *
          0.18;

        const startDistance = Math.max(0, innerDistance + startVariation);
        const endDistance =
          innerDistance +
          usableDistance *
          state.lineLength *
          lengthVariation;

        if (endDistance <= startDistance + 1) {
          continue;
        }

        const widthVariation =
          1 +
          (random() - 0.5) *
          2 *
          state.widthRandom;

        const outerWidth = Math.max(
          0.3,
          baseSize * state.lineWidth * widthVariation
        );

        const innerWidth = Math.max(
          0.05,
          outerWidth * (1 - state.taper)
        );

        const perpendicularX = -directionY;
        const perpendicularY = directionX;
        const startX = centerX + directionX * startDistance;
        const startY = centerY + directionY * startDistance;
        const endX = centerX + directionX * endDistance;
        const endY = centerY + directionY * endDistance;

        rays.push([
          [
            startX + perpendicularX * innerWidth / 2,
            startY + perpendicularY * innerWidth / 2
          ],
          [
            endX + perpendicularX * outerWidth / 2,
            endY + perpendicularY * outerWidth / 2
          ],
          [
            endX - perpendicularX * outerWidth / 2,
            endY - perpendicularY * outerWidth / 2
          ],
          [
            startX - perpendicularX * innerWidth / 2,
            startY - perpendicularY * innerWidth / 2
          ]
        ]);
      }

      return rays;
    }

    function drawLines(targetContext, width, height) {
      targetContext.save();
      targetContext.fillStyle = colorToRgba(state.color, state.opacity);

      for (const polygon of buildRays(width, height)) {
        targetContext.beginPath();
        targetContext.moveTo(polygon[0][0], polygon[0][1]);

        for (let index = 1; index < polygon.length; index += 1) {
          targetContext.lineTo(polygon[index][0], polygon[index][1]);
        }

        targetContext.closePath();
        targetContext.fill();
      }

      targetContext.restore();
    }

    function drawCenterHandle(width, height) {
      const x = state.centerX * width;
      const y = state.centerY * height;

      context.save();
      context.strokeStyle = "#ffd32a";
      context.fillStyle = "#111111";
      context.lineWidth = 2;

      context.beginPath();
      context.arc(x, y, 7, 0, Math.PI * 2);
      context.fill();
      context.stroke();

      context.beginPath();
      context.moveTo(x - 12, y);
      context.lineTo(x + 12, y);
      context.moveTo(x, y - 12);
      context.lineTo(x, y + 12);
      context.stroke();
      context.restore();
    }

    function drawPreview() {
      const bounds = getElement("wrap").getBoundingClientRect();
      const maximumWidth = Math.max(400, Math.floor(bounds.width - 20));
      const maximumHeight = Math.max(300, Math.floor(bounds.height - 20));
      const previewRatio = 1.35;

      let width = maximumWidth;
      let height = Math.floor(width / previewRatio);

      if (height > maximumHeight) {
        height = maximumHeight;
        width = Math.floor(height * previewRatio);
      }

      canvas.width = width;
      canvas.height = height;
      context.clearRect(0, 0, width, height);

      if (hasBackground) {
        const scale = Math.min(
          width / backgroundImage.naturalWidth,
          height / backgroundImage.naturalHeight
        );

        const drawWidth = backgroundImage.naturalWidth * scale;
        const drawHeight = backgroundImage.naturalHeight * scale;

        context.drawImage(
          backgroundImage,
          (width - drawWidth) / 2,
          (height - drawHeight) / 2,
          drawWidth,
          drawHeight
        );
      }

      drawLines(context, width, height);
      drawCenterHandle(width, height);
    }

    function setPreset(presetName) {
      currentPreset = presetName;
      Object.assign(state, presets[presetName]);

      document.querySelectorAll("[data-preset]").forEach((button) => {
        button.classList.toggle(
          "active",
          button.dataset.preset === presetName
        );
      });

      syncControls();
      drawPreview();
    }

    function getPointerPosition(event) {
      const bounds = canvas.getBoundingClientRect();

      return {
        x: (event.clientX - bounds.left) / bounds.width,
        y: (event.clientY - bounds.top) / bounds.height
      };
    }

    canvas.addEventListener("pointerdown", (event) => {
      dragging = true;
      canvas.setPointerCapture(event.pointerId);

      const position = getPointerPosition(event);
      state.centerX = position.x;
      state.centerY = position.y;

      syncControls();
      drawPreview();
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!dragging) {
        return;
      }

      const position = getPointerPosition(event);
      state.centerX = position.x;
      state.centerY = position.y;

      syncControls();
      drawPreview();
    });

    canvas.addEventListener("pointerup", () => {
      dragging = false;
    });

    canvas.addEventListener("pointercancel", () => {
      dragging = false;
    });

    for (const id of controlIds) {
      const input = getElement(id);

      input.addEventListener("input", (event) => {
        state[id] =
          id === "count"
            ? Number(event.target.value)
            : parseFloat(event.target.value);

        event.target.nextElementSibling.value = formatValue(id, state[id]);
        drawPreview();
      });
    }

    document.querySelectorAll("[data-preset]").forEach((button) => {
      button.addEventListener("click", () => {
        setPreset(button.dataset.preset);
      });
    });

    getElement("color").addEventListener("input", (event) => {
      state.color = event.target.value;
      drawPreview();
    });

    getElement("seed").addEventListener("input", (event) => {
      state.seed = (Number(event.target.value) || 0) >>> 0;
      drawPreview();
    });

    getElement("regenerate").addEventListener("click", () => {
      drawPreview();
    });

    getElement("randomSeed").addEventListener("click", () => {
      state.seed = crypto.getRandomValues(new Uint32Array(1))[0];
      syncControls();
      drawPreview();
    });

    getElement("resetCenter").addEventListener("click", () => {
      state.centerX = 0.5;
      state.centerY = 0.5;
      syncControls();
      drawPreview();
    });

    getElement("backgroundFile").addEventListener("change", (event) => {
      const file = event.target.files?.[0];

      if (!file) {
        return;
      }

      const objectUrl = URL.createObjectURL(file);

      backgroundImage.onload = () => {
        hasBackground = true;
        drawPreview();
        URL.revokeObjectURL(objectUrl);
      };

      backgroundImage.onerror = () => {
        URL.revokeObjectURL(objectUrl);
        getElement("status").textContent = "背景画像を読み込めませんでした。";
      };

      backgroundImage.src = objectUrl;
    });

    getElement("clearBackground").addEventListener("click", () => {
      hasBackground = false;
      backgroundImage.removeAttribute("src");
      drawPreview();
    });

    getElement("savePng").addEventListener("click", () => {
      const [width, height] = getElement("resolution")
        .value
        .split("x")
        .map(Number);

      const outputCanvas = document.createElement("canvas");
      outputCanvas.width = width;
      outputCanvas.height = height;

      const outputContext = outputCanvas.getContext("2d");
      drawLines(outputContext, width, height);

      outputCanvas.toBlob((blob) => {
        if (!blob) {
          getElement("status").textContent = "PNGの作成に失敗しました。";
          return;
        }

        const downloadUrl = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = downloadUrl;
        link.download =
          `emphasis-lines-${currentPreset}-${state.seed}-${width}x${height}.png`;

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => {
          URL.revokeObjectURL(downloadUrl);
        }, 1000);

        getElement("status").textContent =
          `透過PNGを保存しました: ${width} × ${height}`;
      }, "image/png");
    });

    getElement("copyJson").addEventListener("click", async () => {
      const json = JSON.stringify(
        {
          version: 2,
          type: "emphasis_lines",
          preset: currentPreset,
          ...state
        },
        null,
        2
      );

      try {
        await navigator.clipboard.writeText(json);
        getElement("status").textContent = "設定JSONをコピーしました。";
      } catch {
        const textarea = document.createElement("textarea");
        textarea.value = json;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";

        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();

        const copied = document.execCommand("copy");
        textarea.remove();

        getElement("status").textContent = copied
          ? "設定JSONをコピーしました。"
          : "コピーできませんでした。";
      }
    });

    if ("ResizeObserver" in window) {
      const resizeObserver = new ResizeObserver(() => {
        drawPreview();
      });

      resizeObserver.observe(getElement("wrap"));
    } else {
      window.addEventListener("resize", drawPreview);
    }

    syncControls();
    drawPreview();
  </script>
</body>
</html>
